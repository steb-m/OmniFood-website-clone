<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnifood</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poller+One&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="hero">
            <p>Goodbye junk food.</p>
            <p>hello super healthy meals.</p>
            <div class="buttons"> 
                <input type="button" value="I'm hungry">
                <input type="button" value="Show me more">
            </div>
        </div>
    </header>
    <article>
        
    
    <figure>
        <div class="content">
            <p class="content headerText">get food fast — not fast food</p>
            <hr>
            <p class="content bodyText">Hello, we're Omnifood, your new premium food delivery service. We know you're always busy. <br>
            No time for cooking. So let us take care of that, we're really good at it, we promise!</p>
            <div class="flexbox-container">
                <div class="flexbox-item">
                    <img src="" alt="">
                    <p class="flexbox-item headerText"></p>
                </div>
                <div class="flexbox-item">
                    <img src="Omnifood Contents/Omnifood Contents/" alt="">
                    <p class="flexbox-item headerText">up to 365 days/year</p>
                    <p class="flexbox-item bodyText">Never cook again! We really mean that. Our subscription plans include up to 365 days/year coverage. You can also choose to order more flexibly if that's your style.</p>
                </div>
                <div class="flexbox-item">
                    <img src="Omnifood Contents/Omnifood Contents/logo-white.png" alt="">
                    <p class="flexbox-item headerText">quality ingredients</p>
                    <p class="flexbox-item bodyText">All our vegetables are fresh, organic and non-GMO. Our meat comes from animals raised without antibiotics or growth hormones. So you can eat well and feel good about it.</p>
                </div>
                <div class="flexbox-item">
                    <img src="" alt="">
                    <p class="flexbox-item headerText"></p>
                </div>
            </div>
            
        </div>
    </figure>
    </article>
</body>
</html>
